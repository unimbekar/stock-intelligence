    <text x="24" y="256">Trading Desk</text>
    <text x="24" y="284">Research</text>
    <text x="24" y="312">Alerts</text>
    <text x="24" y="340">AI Assistant</text>
  </g>
  <text x="220" y="36" fill="#e0b15a" font-family="ui-sans-serif, sans-serif" font-size="11" letter-spacing="1.8">EOD DATA</text>
  <line x1="196" y1="52" x2="960" y2="52" stroke="#313a46"/>
  <text x="220" y="86" fill="#9aa3ae" font-family="ui-sans-serif, sans-serif" font-size="11" letter-spacing="1.8">PORTFOLIO</text>
  <text x="220" y="118" fill="#ebe6dc" font-family="ui-sans-serif, sans-serif" font-size="28">Primary</text>
  <rect x="220" y="140" width="716" height="44" fill="#181d23" stroke="#313a46"/>
  <text x="232" y="166" fill="#9aa3ae" font-family="ui-sans-serif, sans-serif" font-size="13">Symbol</text>
  <text x="420" y="166" fill="#9aa3ae" font-family="ui-sans-serif, sans-serif" font-size="13">Shares</text>
  <text x="560" y="166" fill="#9aa3ae" font-family="ui-sans-serif, sans-serif" font-size="13">Price you paid</text>
  <text x="820" y="166" fill="#ebe6dc" font-family="ui-sans-serif, sans-serif" font-size="13">Add holding</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="12">
    <rect x="220" y="200" width="170" height="64" fill="#181d23" stroke="#313a46"/>
    <text x="232" y="222" fill="#9aa3ae">Equity</text>
