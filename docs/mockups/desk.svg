    <text x="220" y="374" fill="#ebe6dc">IWM</text>
    <text x="300" y="374" fill="#ebe6dc">281.52</text>
  </g>
  <rect x="520" y="298" width="416" height="150" fill="#181d23" stroke="#313a46"/>
  <text x="536" y="326" fill="#ebe6dc" font-family="ui-sans-serif, sans-serif" font-size="14">Open positions</text>
