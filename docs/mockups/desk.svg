  <text x="220" y="500" fill="#9aa3ae" font-family="ui-sans-serif, sans-serif" font-size="12">Session 2026-10-02  /  seeded paper account  /  $50,000 capital, $2,000 daily target</text>
  <text x="220" y="528" fill="#9aa3ae" font-family="ui-sans-serif, sans-serif" font-size="12">4.0% is $2,000 divided by $50,000. It is arithmetic, shown on the desk, and it is not a forecast.</text>
