  <text x="220" y="122" fill="#ebe6dc" font-family="ui-sans-serif, sans-serif" font-size="28">Meridian</text>
  <text x="220" y="148" fill="#9aa3ae" font-family="ui-sans-serif, sans-serif" font-size="13">Paper equity, risk, and research on this machine. A daily profit target is arithmetic.</text>
