  <text x="220" y="36" fill="#e0b15a" font-family="ui-sans-serif, sans-serif" font-size="11" letter-spacing="1.8">EOD DATA</text>
  <text x="820" y="36" fill="#ebe6dc" font-family="ui-sans-serif, sans-serif" font-size="13">Sign out</text>
  <line x1="196" y1="52" x2="960" y2="52" stroke="#313a46"/>
