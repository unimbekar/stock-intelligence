<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Meridian dashboard</title>
  <desc id="desc">Dark equity desk with equity, cash, today's result, and the required return.</desc>
  <rect width="960" height="560" fill="#101317"/>
