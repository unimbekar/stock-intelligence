    <text x="536" y="358" fill="#d7b07a">NVDA</text>
    <text x="820" y="358" fill="#3dbe86" text-anchor="end">+1,534.55</text>
    <text x="536" y="384" fill="#d7b07a">MSFT</text>
    <text x="820" y="384" fill="#3dbe86" text-anchor="end">+1,075.30</text>
    <text x="536" y="410" fill="#d7b07a">LLY</text>
    <text x="820" y="410" fill="#3dbe86" text-anchor="end">+1,814.25</text>
    <text x="536" y="436" fill="#d7b07a">TSLA</text>
    <text x="820" y="436" fill="#3dbe86" text-anchor="end">+5.90</text>
