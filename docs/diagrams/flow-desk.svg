<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title">
  <title id="title">Opening the desk</title>
  <rect width="1200" height="340" fill="#f4f0e7"/>
  <text x="40" y="42" fill="#8a5628" font-family="Liberation Sans, sans-serif" font-size="13" letter-spacing="2">OPEN THE DESK</text>
  <line x1="88" y1="78" x2="1112" y2="78" stroke="#d5cdc0" stroke-width="3"/>
  <g font-family="Liberation Sans, sans-serif">
    <g>
      <circle cx="88" cy="78" r="16" fill="#1b1916"/>
      <text x="88" y="83" text-anchor="middle" fill="#f4f0e7" font-size="13">1</text>
      <rect x="28" y="112" width="160" height="168" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
      <text x="108" y="156" text-anchor="middle" fill="#8a5628" font-size="12">YOU</text>
      <text x="108" y="190" text-anchor="middle" fill="#1b1916" font-size="16">Open</text>
      <text x="108" y="212" text-anchor="middle" fill="#1b1916" font-size="16">the desk</text>
    </g>
    <g>
      <circle cx="344" cy="78" r="16" fill="#1b1916"/>
      <text x="344" y="83" text-anchor="middle" fill="#f4f0e7" font-size="13">2</text>
      <rect x="264" y="112" width="160" height="168" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
      <text x="344" y="156" text-anchor="middle" fill="#8a5628" font-size="12">NEXT.JS</text>
      <text x="344" y="190" text-anchor="middle" fill="#1b1916" font-size="16">Ask for the</text>
      <text x="344" y="212" text-anchor="middle" fill="#1b1916" font-size="16">workspace</text>
    </g>
    <g>
      <circle cx="600" cy="78" r="16" fill="#1b1916"/>
      <text x="600" y="83" text-anchor="middle" fill="#f4f0e7" font-size="13">3</text>
      <rect x="500" y="112" width="200" height="168" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
      <text x="600" y="156" text-anchor="middle" fill="#8a5628" font-size="12">POSTGRESQL</text>
      <text x="600" y="190" text-anchor="middle" fill="#1b1916" font-size="16">Fills, lists,</text>
      <text x="600" y="212" text-anchor="middle" fill="#1b1916" font-size="16">alerts</text>
    </g>
    <g>
      <circle cx="856" cy="78" r="16" fill="#1b1916"/>
      <text x="856" y="83" text-anchor="middle" fill="#f4f0e7" font-size="13">4</text>
      <rect x="756" y="112" width="200" height="168" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
      <text x="856" y="156" text-anchor="middle" fill="#8a5628" font-size="12">NASDAQ</text>
      <text x="856" y="190" text-anchor="middle" fill="#1b1916" font-size="16">Last close</text>
      <text x="856" y="212" text-anchor="middle" fill="#1b1916" font-size="16">for each symbol</text>
    </g>
    <g>
      <circle cx="1112" cy="78" r="16" fill="#8a5628"/>
      <text x="1112" y="83" text-anchor="middle" fill="#f4f0e7" font-size="13">5</text>
      <rect x="1012" y="112" width="168" height="168" rx="14" fill="#1b1916"/>
      <text x="1096" y="156" text-anchor="middle" fill="#d7b07a" font-size="12">DESK</text>
      <text x="1096" y="190" text-anchor="middle" fill="#f4f0e7" font-size="16">Equity, EPS,</text>
      <text x="1096" y="212" text-anchor="middle" fill="#f4f0e7" font-size="16">local mark</text>
    </g>
  </g>
</svg>
