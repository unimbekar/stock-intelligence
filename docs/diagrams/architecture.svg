<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title">
  <title id="title">Meridian architecture</title>
  <rect width="1200" height="760" fill="#f4f0e7"/>
  <text x="64" y="56" fill="#8a5628" font-family="Liberation Sans, sans-serif" font-size="13" letter-spacing="2.2">DESIGN</text>
  <text x="64" y="92" fill="#1b1916" font-family="Liberation Sans, sans-serif" font-size="32">One desk, three records</text>
  <text x="64" y="122" fill="#5f584e" font-family="Liberation Sans, sans-serif" font-size="16">The browser paints. The API keeps the ledger and calls Nasdaq, SEC EDGAR, and Qwen.</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a5628"/>
    </marker>
  </defs>
  <g font-family="Liberation Sans, sans-serif">
    <rect x="470" y="156" width="260" height="72" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="600" y="186" text-anchor="middle" fill="#1b1916" font-size="18">Browser</text>
    <text x="600" y="208" text-anchor="middle" fill="#5f584e" font-size="13">localhost:3020</text>
    <line x1="600" y1="228" x2="600" y2="262" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="470" y="268" width="260" height="72" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="600" y="298" text-anchor="middle" fill="#1b1916" font-size="18">Next.js desk</text>
    <text x="600" y="320" text-anchor="middle" fill="#5f584e" font-size="13">Shell, forms, charts</text>
    <line x1="600" y1="340" x2="600" y2="374" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="390" y="380" width="420" height="86" rx="14" fill="#1b1916"/>
    <text x="600" y="414" text-anchor="middle" fill="#f4f0e7" font-size="20">FastAPI</text>
    <text x="600" y="440" text-anchor="middle" fill="#d7b07a" font-size="13">Auth, workspace, alert sweep</text>
    <rect x="836" y="394" width="220" height="58" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="946" y="418" text-anchor="middle" fill="#1b1916" font-size="15">Redis</text>
    <text x="946" y="438" text-anchor="middle" fill="#5f584e" font-size="12">Rate limit</text>
    <line x1="810" y1="423" x2="836" y2="423" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="470" y1="466" x2="210" y2="520" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="600" y1="466" x2="600" y2="520" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="730" y1="466" x2="990" y2="520" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="64" y="528" width="292" height="78" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="210" y="558" text-anchor="middle" fill="#1b1916" font-size="18">Ledger</text>
    <text x="210" y="582" text-anchor="middle" fill="#5f584e" font-size="13">Fills, cash, cost basis</text>
    <rect x="454" y="528" width="292" height="78" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="600" y="558" text-anchor="middle" fill="#1b1916" font-size="18">Market book</text>
    <text x="600" y="582" text-anchor="middle" fill="#5f584e" font-size="13">Last close and filings</text>
    <rect x="844" y="528" width="292" height="78" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="990" y="558" text-anchor="middle" fill="#1b1916" font-size="18">Assistant</text>
    <text x="990" y="582" text-anchor="middle" fill="#5f584e" font-size="13">Writes only from the bundle</text>
    <line x1="210" y1="606" x2="210" y2="642" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="560" y1="606" x2="524" y2="626" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="640" y1="606" x2="676" y2="626" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="990" y1="606" x2="990" y2="642" stroke="#8a5628" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="64" y="648" width="292" height="64" rx="14" fill="#fffdf8" stroke="#8a5628"/>
    <text x="210" y="686" text-anchor="middle" fill="#1b1916" font-size="16">PostgreSQL</text>
    <rect x="454" y="632" width="140" height="80" rx="14" fill="#fffdf8" stroke="#8a5628"/>
    <text x="524" y="668" text-anchor="middle" fill="#1b1916" font-size="15">Nasdaq</text>
    <text x="524" y="690" text-anchor="middle" fill="#5f584e" font-size="12">Last session</text>
    <rect x="606" y="632" width="140" height="80" rx="14" fill="#fffdf8" stroke="#8a5628"/>
    <text x="676" y="668" text-anchor="middle" fill="#1b1916" font-size="15">SEC EDGAR</text>
    <text x="676" y="690" text-anchor="middle" fill="#5f584e" font-size="12">Facts, filings</text>
    <rect x="844" y="648" width="292" height="64" rx="14" fill="#fffdf8" stroke="#8a5628"/>
    <text x="990" y="686" text-anchor="middle" fill="#1b1916" font-size="16">Qwen 3.6 on this GPU</text>
  </g>
</svg>
