<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title">
  <title id="title">Alert email</title>
  <rect width="1200" height="420" fill="#f4f0e7"/>
  <text x="40" y="42" fill="#8a5628" font-family="Liberation Sans, sans-serif" font-size="13" letter-spacing="2">ALERT EMAIL</text>
  <text x="40" y="72" fill="#5f584e" font-family="Liberation Sans, sans-serif" font-size="15">One message when the close crosses. The next waits until the price comes back inside.</text>
  <line x1="120" y1="118" x2="760" y2="118" stroke="#d5cdc0" stroke-width="3"/>
  <g font-family="Liberation Sans, sans-serif">
    <circle cx="120" cy="118" r="16" fill="#1b1916"/>
    <text x="120" y="123" text-anchor="middle" fill="#f4f0e7" font-size="13">1</text>
    <rect x="40" y="152" width="180" height="120" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="130" y="196" text-anchor="middle" fill="#8a5628" font-size="12">EVERY 5 MIN</text>
    <text x="130" y="228" text-anchor="middle" fill="#1b1916" font-size="16">Read enabled</text>
    <text x="130" y="250" text-anchor="middle" fill="#1b1916" font-size="16">alerts</text>
    <circle cx="440" cy="118" r="16" fill="#1b1916"/>
    <text x="440" y="123" text-anchor="middle" fill="#f4f0e7" font-size="13">2</text>
    <rect x="340" y="152" width="200" height="120" rx="14" fill="#ffffff" stroke="#d5cdc0"/>
    <text x="440" y="196" text-anchor="middle" fill="#8a5628" font-size="12">NASDAQ</text>
    <text x="440" y="228" text-anchor="middle" fill="#1b1916" font-size="16">Last close</text>
    <circle cx="760" cy="118" r="16" fill="#8a5628"/>
    <text x="760" y="123" text-anchor="middle" fill="#f4f0e7" font-size="13">3</text>
    <rect x="640" y="152" width="240" height="120" rx="14" fill="#1b1916"/>
    <text x="760" y="196" text-anchor="middle" fill="#d7b07a" font-size="12">COMPARE</text>
    <text x="760" y="228" text-anchor="middle" fill="#f4f0e7" font-size="16">Did the close cross?</text>
    <line x1="760" y1="272" x2="320" y2="312" stroke="#8a5628" stroke-width="1.6"/>
    <line x1="760" y1="272" x2="880" y2="312" stroke="#8a5628" stroke-width="1.6"/>
    <rect x="80" y="320" width="420" height="72" rx="14" fill="#ffffff" stroke="#0d7a45"/>
    <text x="290" y="350" text-anchor="middle" fill="#0d7a45" font-size="13">CROSSED, NOT YET MAILED</text>
    <text x="290" y="374" text-anchor="middle" fill="#1b1916" font-size="16">Send one email, then record it</text>
    <rect x="700" y="320" width="420" height="72" rx="14" fill="#ffffff" stroke="#8a5628"/>
    <text x="910" y="350" text-anchor="middle" fill="#8a5628" font-size="13">BACK INSIDE THE LEVEL</text>
    <text x="910" y="374" text-anchor="middle" fill="#1b1916" font-size="16">Arm the alert again</text>
  </g>
</svg>
