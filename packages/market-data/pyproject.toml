[project]
name = "meridian-market"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["meridian-config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_market"]

[tool.uv.sources]
meridian-config = { workspace = true }
