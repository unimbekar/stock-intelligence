dependencies = ["meridian-market"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_research"]

[tool.uv.sources]
meridian-market = { workspace = true }
